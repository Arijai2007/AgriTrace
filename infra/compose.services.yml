name: agritrace-services
services:
  ipfs:
    image: ipfs/kubo:v0.38.1
    ports: ["127.0.0.1:5001:5001", "127.0.0.1:8080:8080"]
    volumes: ["ipfs-data:/data/ipfs"]
  mqtt:
    image: eclipse-mosquitto:2.0
    ports: ["127.0.0.1:1883:1883"]
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
volumes:
  ipfs-data:
